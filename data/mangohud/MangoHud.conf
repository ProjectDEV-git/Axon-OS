### Axon OS default MangoHud layout: one small line in the top-left corner.
### MangoHud 0.6.9 (Ubuntu 24.04) reads only ~/.config/MangoHud/MangoHud.conf, so Axon copies
### this file there for new users and when Game Center turns the overlay on. GOverlay edits the
### copy, never this file. Every key below is checked against MangoHud's own example config.
### The overlay is off until MANGOHUD=1 is set (Game Center > Performance) or a game is
### started with `mangohud %command%`.

legacy_layout=0
horizontal
position=top-left
font_size=20
background_alpha=0.35
round_corners=8

# What it shows: frames per second, frame time, processor and graphics card load and heat
fps
frametime
cpu_stats
cpu_temp
gpu_stats
gpu_temp

# Hide or show it while playing (right Shift + F12); move it (right Shift + F11)
toggle_hud=Shift_R+F12
toggle_hud_position=Shift_R+F11
