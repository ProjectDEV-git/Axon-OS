name: Build ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build/**"
      - "apps/**"
      - "services/**"
      - "shell/**"
      - "theme/**"
      - "data/**"
      - "installer/**"
      - "plymouth/**"
      - ".github/workflows/build-iso.yml"
    tags:
      - "v*"

# The build runs third-party package scripts as root, so it gets a read-only
# token; only the tag-only publish job below can write to releases.
permissions:
  contents: read
  # read the package list of the last good build, to show what grew
  actions: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build ${{ matrix.edition }} ISO (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      # An over-size NVIDIA ISO must not hide a good Standard one (or the other way round)
      fail-fast: false
      matrix:
        edition: [standard, nvidia]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Free space on / and /mnt:"
          df -h / /mnt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools rsync

      # APEX-WIN (Windows programs) is Rust. Build it as the runner user with
      # the preinstalled toolchain; build.sh runs under sudo, which drops it.
      - name: Build APEX-WIN runner
        run: |
          cargo --version
          bash scripts/build-apex-win.sh

      # Package names are checked against the Ubuntu archive first, so a typo fails here
      # in a minute instead of hours into the build
      - name: Check package names exist
        run: python3 scripts/verify-packages.py

      # The package list of the last good build on main, so the size report can say what grew
      - name: Fetch previous package list
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION: ${{ matrix.edition }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow build-iso.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')"
          [ -n "${run_id}" ] || exit 0
          gh run download "${run_id}" --name "axon-os-packages-${EDITION}" --dir previous
          ls previous

      - name: Build ISO
        run: |
          previous=""
          if ls previous/*.packages.tsv >/dev/null 2>&1; then
            previous="$(ls "$PWD"/previous/*.packages.tsv | head -1)"
          fi
          # build.sh fails the job if the ISO is over its edition's hard limit
          sudo AXON_BUILD_DIR=/mnt/axon-build AXON_PREVIOUS_PACKAGES="${previous}" \
            bash build/build.sh --ci --edition "${{ matrix.edition }}"

      - name: Size report
        run: |
          set -euo pipefail
          ls -lh dist/
          cat dist/*.sha256
          {
            echo '### ISO size: ${{ matrix.edition }}'
            echo '```'
            bash scripts/check-iso-size.sh --edition "${{ matrix.edition }}" \
              --packages dist/*.packages.tsv dist/*.iso
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Verify ISO is bootable (El Torito + live payload)
        run: |
          set -euo pipefail
          ISO=$(ls dist/*.iso)
          echo "Verifying $ISO"

          # 1. El Torito boot catalog must advertise BOTH BIOS and UEFI so the
          #    image boots on legacy and modern firmware.
          report=$(xorriso -indev "$ISO" -report_el_torito plain 2>/dev/null)
          echo "$report"
          echo "$report" | grep -qi 'BIOS' || { echo "::error::ISO has no BIOS El Torito boot entry"; exit 1; }
          echo "$report" | grep -qi 'UEFI' || { echo "::error::ISO has no UEFI El Torito boot entry"; exit 1; }

          # 2. The live-boot payload must be present, or the ISO boots to nothing.
          listing=$(xorriso -indev "$ISO" -find / -type f 2>/dev/null)
          for f in /casper/vmlinuz /casper/initrd /casper/filesystem.squashfs /boot/grub/grub.cfg; do
            echo "$listing" | grep -q "'$f'" || { echo "::error::ISO is missing $f"; exit 1; }
          done

          # 3. A real root filesystem, not an empty placeholder.
          size=$(stat -c%s "$ISO")
          [ "$size" -gt 700000000 ] || { echo "::error::ISO is only $size bytes — build likely incomplete"; exit 1; }

          echo "✓ ISO verification passed: hybrid BIOS+UEFI boot catalog and live payload present ($((size/1024/1024)) MiB)."

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: axon-os-iso-${{ matrix.edition }}
          path: |
            dist/*.iso
            dist/*.sha256
            dist/*.sbom.spdx.json
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      # Small, kept longer: the next build compares its package sizes with this one
      - name: Upload package sizes
        uses: actions/upload-artifact@v4
        with:
          name: axon-os-packages-${{ matrix.edition }}
          path: dist/*.packages.tsv
          retention-days: 90
          if-no-files-found: error

  # Version tags (vX.Y.Z, from release.yml) publish a normal release. Builds of
  # main publish a rolling "nightly" pre-release that each new main build
  # replaces, so the newest ISO is always on the Releases page. Builds of other
  # branches stay downloadable artifacts only.
  publish-release:
    name: Publish ISO to Releases
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: build-iso
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download ISO artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: axon-os-iso-*
          merge-multiple: true
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            # release.yml normally creates it first; a hand-pushed tag has none yet
            if ! gh release view "${TAG}" >/dev/null 2>&1; then
              gh release create "${TAG}" --verify-tag --title "Axon OS ${TAG}" --generate-notes
            fi
          else
            TAG="nightly"
            # Replace the previous nightly and move its tag to this commit
            gh release delete "${TAG}" --cleanup-tag --yes 2>/dev/null || true
            gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
            gh release create "${TAG}" --target "${GITHUB_SHA}" --prerelease \
              --title "Axon OS nightly ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
              --notes "Automatic build of \`main\` at ${GITHUB_SHA::7}. Each new build of \`main\` replaces this pre-release.

          For a versioned release, run Actions → Release → Run workflow."
          fi
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"

      - name: Upload ISOs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" dist/*.sha256 dist/*.sbom.spdx.json --clobber
          NOTES="$(gh release view "${TAG}" --json body --jq .body)"
          # Release assets are capped at 2 GiB, so a larger ISO is attached in
          # parts; `cat` joins them back and the .sha256 checks the result.
          for ISO in dist/*.iso; do
            NAME="$(basename "${ISO}")"
            if [ "$(stat -c%s "${ISO}")" -lt 2147000000 ]; then
              gh release upload "${TAG}" "${ISO}" --clobber
              continue
            fi
            split -b 1900M -d -a 2 "${ISO}" "${ISO}.part"
            rm -f "${ISO}"
            gh release upload "${TAG}" "${ISO}".part* --clobber
            # A re-run must not add the same instructions twice
            case "${NOTES}" in *"### Download ${NAME}"*) continue ;; esac
            # shellcheck disable=SC2016 # the backticks are Markdown, not shell
            NOTES="$(printf '%s\n\n### Download %s\n\nThe ISO is split into parts because GitHub caps release files at 2 GB. Download every `%s.partNN` file and `%s.sha256` into one folder, then run:\n\n```bash\ncat %s.part* > %s && sha256sum -c %s.sha256\n```\n' \
              "${NOTES}" "${NAME}" "${NAME}" "${NAME}" "${NAME}" "${NAME}" "${NAME}")"
          done
          printf '%s\n' "${NOTES}" > notes.md
          gh release edit "${TAG}" --notes-file notes.md
          echo "Published to $(gh release view "${TAG}" --json url --jq .url)" | tee -a "${GITHUB_STEP_SUMMARY}"
