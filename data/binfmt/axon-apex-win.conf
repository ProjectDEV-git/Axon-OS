# Axon OS: the kernel hands every file that starts with the Windows "MZ"
# header to APEX-WIN, so `./program.exe` runs like a native binary.
# Loaded at boot by systemd-binfmt.service (binfmt.d(5)).
#
# :name:type:offset:magic:mask:interpreter:flags
#   mask \xff\xff is required (without it the kernel rejects the line).
#   F opens the interpreter once at registration; never C, which would take
#   credentials from the .exe (a setuid .exe would run as its owner).
:APEX-WIN:M:0:\x4d\x5a:\xff\xff:/usr/bin/axon-apex-run:F
