# Axon OS ISO size budgets, in megabytes (1 MB = 1,000,000 bytes, so 3500 is "3.5 GB").
# Sourced by scripts/check-iso-size.sh and the Build ISO workflow.
#
# TARGET: aim for this; going over prints a warning.
# LIMIT:  the build fails above this. Raise it only with a reason in the PR.
#
# Any change that adds more than ADDED_MB_NEEDS_REASON to an ISO must say why in its pull
# request description, and which rule justifies it (A boot/install/connect, B Axon identity,
# C headline gaming experience offline; see "Axon OS ISO policy" in AGENTS.md).
STANDARD_TARGET_MB=3500
STANDARD_LIMIT_MB=3900
NVIDIA_TARGET_MB=4300
NVIDIA_LIMIT_MB=4700
ADDED_MB_NEEDS_REASON=50
