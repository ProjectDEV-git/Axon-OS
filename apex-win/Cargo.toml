[workspace]
resolver = "2"
members = [
    "crates/win-sandbox-runner",
    "crates/win-sandbox-gui",
    "crates/win-sandbox-common",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.75"

[workspace.dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "user" provides Uid/Gid/chown, used by prefix.rs to hand ownership of the
# Wine prefix to the invoking user when the daemon runs as root. "mount" is
# Linux-only (macOS has no mount(2)/umount(2) namespace semantics) and is
# added per-platform in crates/win-sandbox-runner/Cargo.toml instead of here.
nix = { version = "0.29", features = ["process", "signal", "fs", "user"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
# landlock is Linux-only (a Linux LSM). Declared as a per-platform dependency
# in crates/win-sandbox-runner/Cargo.toml, not here, so `cargo build` on
# macOS does not even attempt to resolve it.
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7" }
zbus = { version = "4", default-features = false, features = ["tokio"] }
libc = "0.2"
which = "7"
tokio = { version = "1", features = ["full"] }
win-sandbox-common = { path = "crates/win-sandbox-common" }
