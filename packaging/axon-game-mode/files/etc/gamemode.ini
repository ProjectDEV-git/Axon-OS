; Axon OS GameMode settings. GameMode's own defaults
; (/usr/share/gamemode/gamemode.ini) apply to everything not set here, and
; ~/.config/gamemode.ini overrides this file. Checked against gamemode 1.8.1.

[general]
; Games get a slightly higher priority. Needs the user to be in the
; "gamemode" group, otherwise GameMode skips it.
renice=10

[custom]
; gamemoded runs these when the first game registers and when the last one ends.
; axon-game-mode tells org.axonos.Gaming, which pauses and resumes the AI.
start=axon-game-mode on
end=axon-game-mode off

; GPU overclocking and forced performance levels ([gpu] apply_gpu_optimisations,
; amd_performance_level) are deliberately left off: they can raise heat and power
; draw and are the user's choice. Add them to ~/.config/gamemode.ini.
