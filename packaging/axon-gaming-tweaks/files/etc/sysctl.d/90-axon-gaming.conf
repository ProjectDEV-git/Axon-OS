# Axon OS gaming settings.

# Some games (and Proton titles) need a very large number of memory map areas;
# the kernel default of 65530 makes them crash on startup.
vm.max_map_count = 2147483642

# Split-lock mitigation slows down the offending thread by ~10 ms per split
# lock, which shows up as large stutters in some games. Don't throttle.
kernel.split_lock_mitigate = 0
